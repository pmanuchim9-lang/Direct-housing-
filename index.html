<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>Direct PH - Direct to Landlord</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F5F0;font-family:Inter,system-ui,sans-serif}
.topbar{position:sticky;top:0;z-index:1000;background:#0A1931!important;color:#fff!important;padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:18px;letter-spacing:.4px;cursor:pointer}
.tabs{display:flex;gap:10px;padding:10px}
.tab{padding:10px 14px;border-radius:10px;font-weight:800;border:none;cursor:pointer;text-align:center}
.tab-active{background:#FFCC00!important;color:#0A1931!important}
.tab-inactive{background:#e9e9e9!important;color:#0A1931!important;border:1px solid #334155!important}
.hero{background:linear-gradient(135deg,#0A1931,#112a56 65%,#0A1931 100%)!important;color:#fff!important;padding:22px;font-size:20px;line-height:1.2;font-weight:800}
.searchCenter{padding:12px;display:flex;justify-content:center;margin-top:16px}
.aiWrap{width:100%;max-width:780px;background:#fff!important;border-radius:12px;padding:6px 6px 6px 12px;display:flex;gap:6px;align-items:center}
.aiWrap input{flex:1;border:none;outline:none;padding:12px 8px;font-size:14px;background:#fff!important;color:#0F172A}
.btn{border:none;border-radius:10px;padding:12px 14px;font-weight:800;cursor:pointer}
.btn-y{background:#FFCC00!important;color:#0A1931!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:1120px;margin:0 auto;background:#F5F5F0}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:#fff!important;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.card img{width:100%;height:184px;object-fit:cover;background:#e2e8f0}
.card_body{padding:12px;background:#fff!important}
.badge{background:#0A1931!important;color:#FFCC00!important;padding:4px 8px;border-radius:8px;font-size:12px;font-weight:800;display:inline-block;margin-bottom:6px}
.meta{font-size:13px;color:#475569!important;margin:4px 0;line-height:1.4}
.callBtn{width:100%;text-align:center;padding:12px 8px;border-radius:10px;font-size:14px;font-weight:800;text-decoration:none;display:block;background:#0A1931!important;color:#fff!important;margin-top:8px}
.formWrap{width:92%;max-width:600px;margin:0 auto;background:#fff!important;padding:16px 12px;border-radius:0 0 20px 20px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.input{width:100%;padding:14px;border:1px solid #cbd5e1!important;border-radius:10px;font-size:14px;background:#fff!important;color:#0F172A!important;margin-top:8px}
.paybox{border:2px dashed #FFCC00;padding:12px;background:#fffde7;border-radius:12px;margin:12px 0}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="topbar">
<div class="logo" id="logoTrigger" onclick="showTab('tenant')">🏠 HOUSE <span style="color:#FFCC00">DIRECT</span> PH</div>
<div style="display:flex;gap:8px">
<button class="tab tab-active" id="tab-tenant" onclick="showTab('tenant')">Tenants</button>
<button class="tab tab-inactive" id="tab-landlord" onclick="showTab('landlord')">Landlords</button>
</div>
</div>

<div id="view-tenant">
<div class="hero"><h2>Find House - Call Landlord Direct - No Agent Fee</h2><p style="font-size:14px;margin-top:6px;font-weight:500">✔ Verified Listings + 2 Photos + Video - Direct Contact</p></div>
<div class="searchCenter"><div class="aiWrap"><input id="aiInput" placeholder="Search e.g 2 bed Rumola..."><button class="btn btn-y" onclick="aiSearch()">Search</button></div></div>
<div id="aiResult" style="color:#FFCC00;font-size:13px;margin-top:10px;font-weight:600;text-align:center"></div>
<div class="grid" id="propertyGrid"></div>
</div>

<div id="view-landlord" class="hidden">
<div class="formWrap">
<h3 style="text-align:center;color:#0A1931">List Your House Direct - Pay Once</h3>
<div class="paybox">Pay <b>#5000</b> to 8037034201 Opay - Pmanuchim Uzoma. Upload proof + house pics + video. We verify in 24hrs.</div>
<input class="input" id="l_title" placeholder="Title e.g 2 Bedroom in Rumokoro">
<input class="input" id="l_location" placeholder="Location e.g Rumokoro, Port Harcourt">
<input class="input" id="l_price" type="number" placeholder="Price per year e.g 500000">
<input class="input" id="l_phone" placeholder="Your WhatsApp Number">
<input class="input" id="l_whatsapp" placeholder="Call Number (if different)">
<select class="input" id="l_type"><option value="2 Bedroom">2 Bedroom</option><option value="3 Bedroom">3 Bedroom</option><option value="Self Contain">Self Contain</option><option value="Single Room">Single Room</option></select>
<textarea class="input" id="l_desc" placeholder="Describe house - water, light, etc"></textarea>
<label class="input" style="background:#fffde7!important">House Photo 1 (Required) <input type="file" id="f1" accept="image/*"></label>
<label class="input" style="background:#fffde7!important">House Photo 2 <input type="file" id="f2" accept="image/*"></label>
<label class="input">Video (Optional 30sec) <input type="file" id="f3" accept="video/*"></label>
<label class="input" style="border:2px dashed #0A1931">Payment Proof Screenshot <input type="file" id="fpay" accept="image/*"></label>
<input class="input" id="l_ref" placeholder="Enter Payment Ref (e.g last 4 digits)">
<button class="btn btn-y" style="width:100%;margin-top:12px;padding:16px" id="submitBtn" onclick="submitHouse()">Submit - We Verify in 24hrs</button>
<div id="l_msg" style="margin-top:10px;font-weight:700;text-align:center"></div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://bdcgqzqjgqhqkqhqkqhq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3amR0b3Jhc2lxa2R0dmRzZm1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDg0NjQsImV4cCI6MjEwODA4NDQ2NH0.0a6d2p4x904PCPEtuLFSrStUQBR2G8HVM_cHwotTTB0;

let supabaseClient = null;
try {
  const { createClient } = supabase;
  supabaseClient = createClient('https://oozvmyhcahjskhptcohh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3amR0b3Jhc2lxa2R0dmRzZm1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDg0NjQsImV4cCI6MjEwODA4NDQ2NH0.0a6d2p4x904PCPEtuLFSrStUQBR2G8HVM_cHwotTTB0');
} catch(e){ console.log(e) }

function showTab(t){
  document.getElementById('view-tenant').className = t==='tenant' ? '' : 'hidden';
  document.getElementById('view-landlord').className = t==='landlord' ? '' : 'hidden';
  document.getElementById('tab-tenant').className = t==='tenant' ? 'tab tab-active' : 'tab tab-inactive';
  document.getElementById('tab-landlord').className = t==='landlord' ? 'tab tab-active' : 'tab tab-inactive';
}

async function safeUpload(file){
 if(!file) return null;
 const name = Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9.]/g,'_');
 try{
  let { data, error } = await supabaseClient.storage.from('house-images').upload(name, file, {cacheControl:'3600', upsert:false});
  if(error){
    console.log('house-images failed, trying listings', error);
    let r2 = await supabaseClient.storage.from('listings').upload(name, file, {cacheControl:'3600', upsert:false});
    if(r2.error) throw r2.error;
    data = r2.data;
  }
  const { data: urlData } = supabaseClient.storage.from('house-images').getPublicUrl(name);
  if(urlData && urlData.publicUrl) return urlData.publicUrl;
  const { data: urlData2 } = supabaseClient.storage.from('listings').getPublicUrl(name);
  return urlData2.publicUrl || null;
 }catch(err){
  console.log('Upload error but continue', err);
  return null;
 }
}

async function submitHouse(){
 const btn = document.getElementById('submitBtn');
 const msg = document.getElementById('l_msg');
 const f1 = document.getElementById('f1').files[0];
 if(!f1){ msg.style.color='red'; msg.innerHTML='Please add at least Photo 1'; return; }

 btn.disabled=true; btn.innerHTML='Uploading... Please wait 20sec';
 msg.style.color='#0A1931'; msg.innerHTML='Uploading photos... Do not close';

 try{
  const img1 = await safeUpload(f1);
  const img2 = await safeUpload(document.getElementById('f2').files[0]);
  const video = await safeUpload(document.getElementById('f3').files[0]);
  const payproof = await safeUpload(document.getElementById('fpay').files[0]);

  const payload = {
    title: document.getElementById('l_title').value || 'House in PH',
    location: document.getElementById('l_location').value || 'Port Harcourt',
    price: parseInt(document.getElementById('l_price').value) || 0,
    phone: document.getElementById('l_phone').value || '',
    whatsapp: document.getElementById('l_whatsapp').value || document.getElementById('l_phone').value || '',
    type: document.getElementById('l_type').value,
    description: document.getElementById('l_desc').value || '',
    image_url: img1,
    image2_url: img2,
    video_url: video,
    payment_proof: payproof,
    payment_ref: document.getElementById('l_ref').value || '5000',
    status: 'pending'
  };

  console.log('Inserting', payload);
  const { data, error } = await supabaseClient.from('houses').insert([payload]);
  if(error) throw error;

  msg.style.color='green'; msg.innerHTML='✅ SUCCESS! House submitted. We will verify in 24hrs. Ref: '+payload.payment_ref;
  btn.innerHTML='✅ Submitted!';
  setTimeout(()=>{ showTab('tenant'); loadHouses(); },2000);

 }catch(err){
  console.error(err);
  msg.style.color='red';
  msg.innerHTML='Error: '+(err.message||'Failed to fetch')+'<br>But we saved your house with photo. Try smaller photos if error again.';
  btn.disabled=false; btn.innerHTML='Try Again - Submit';
 }
}

async function loadHouses(){
 const grid = document.getElementById('propertyGrid');
 grid.innerHTML='Loading houses...';
 try{
  const { data, error } = await supabaseClient.from('houses').select('*').order('id',{ascending:false}).limit(20);
  if(error) throw error;
  if(!data || data.length===0){ grid.innerHTML='<p style="padding:20px">No houses yet. Be first to list!</p>'; return; }
  grid.innerHTML='';
  data.forEach(h=>{
    grid.innerHTML+=`<div class="card"><img src="${h.image_url||'https://via.placeholder.com/400x300?text=No+Image'}" onerror="this.src='https://via.placeholder.com/400x300'"><div class="card_body"><div class="badge">Verified</div><div class="meta"><b>${h.title||''}</b> - ${h.location||''}</div><div class="meta">#${(h.price||0).toLocaleString()} / year - ${h.type||''}</div><a class="callBtn" href="tel:${h.phone}">Call ${h.phone||'Landlord'}</a></div></div>`;
  });
 }catch(e){ grid.innerHTML='Error loading. Check internet.'; }
}

function aiSearch(){
 const q = document.getElementById('aiInput').value.toLowerCase();
 if(!q) return loadHouses();
 document.getElementById('aiResult').innerHTML='Searching for '+q+'...';
 loadHouses();
}

loadHouses();
document.getElementById('logoTrigger').addEventListener('dblclick',()=>{ showTab('landlord'); });
</script>
</body>
  </html>
